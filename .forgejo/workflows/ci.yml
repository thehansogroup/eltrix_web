name: CI

on:
  push:
    branches: [beta, main]
    tags: ["v*"]
  pull_request:
    branches: [beta, main]
  workflow_dispatch:

env:
  IMAGE_NAME: thehansogroup/eltrix_web

jobs:
  # The gate is the `mix ci` alias in mix.exs, exactly as in eltrix_server. CI
  # runs that and nothing else, so a green local run means a green PR and there
  # is no second, weaker definition of passing living in this file.
  #
  # No database service: this site has no Ecto repo. It reads two vendored
  # artefacts and renders them.
  check:
    name: Quality gate
    runs-on: ubuntu-22.04
    # Not on tags. A tag names a commit already gated green on main (branch
    # protection requires the gate), so re-running `mix ci` here is redundant.
    # It is also the one place it *fails*: on a tag the actions/cache is cold
    # (caches are branch-scoped and a tag inherits none), which forces a fresh
    # build of lazy_html, an only:test NIF whose precompiled download 404s in
    # CI and whose source fallback needs a C toolchain the ci-elixir image does
    # not carry (make Error 127). The prod image build below is MIX_ENV=prod,
    # excludes lazy_html, and runs regardless. See oddie-apps/platform#779.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    # jlxq0, not julian. A wrong owner does not error usefully — the runner
    # dies at image pull before any step, so every job fails identically.
    container:
      image: forge.oddie.app/jlxq0/ci-elixir:1.19.5-otp-28
      credentials:
        username: jlxq0
        password: ${{ secrets.FORGE_PUSH_TOKEN }}
    env:
      MIX_ENV: test
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Quality gate
        run: mix ci

  docker:
    name: Build and push image
    runs-on: ubuntu-22.04
    needs: check
    if: |
      always() && !failure() && !cancelled() &&
      (github.ref == 'refs/heads/beta' || startsWith(github.ref, 'refs/tags/v'))
    permissions: { contents: read, packages: write }
    container:
      image: forge.oddie.app/jlxq0/ci-elixir:1.19.5-otp-28
      credentials:
        username: jlxq0
        password: ${{ secrets.FORGE_PUSH_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Quality gate is skipped on tags (it is redundant with main's gate
      # and fails on a cold cache). That skip is only sound while every tag
      # names a commit that already passed on main, and a skipped job reports
      # success, so nothing else would catch a tag cut off an ungated commit.
      # Enforce it here: compare main...<tagged sha>; total_commits is the count
      # of commits in the tag not reachable from main, so 0 means the commit is
      # on main and was gated, and anything else is a tag that never was. Fail
      # closed if the count cannot be read. See oddie-apps/platform#779.
      - name: Refuse a tag that is not on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          api="https://forge.oddie.app/api/v1/repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}"
          n=$(curl -sf -H "Authorization: token ${{ secrets.FORGE_PUSH_TOKEN }}" "$api" | jq -r '.total_commits')
          if ! [[ "$n" =~ ^[0-9]+$ ]]; then
            echo "::error::could not determine whether ${GITHUB_SHA} is on main (got '$n'); refusing"; exit 1
          fi
          if [ "$n" -ne 0 ]; then
            echo "::error::tag commit ${GITHUB_SHA} is ${n} commit(s) ahead of main and never passed its gate; refusing to publish an ungated release"; exit 1
          fi
          echo "tag commit ${GITHUB_SHA} is on main; gated via branch protection"

      - name: Login to Forgejo registry
        run: |
          mkdir -p ~/.docker
          F_AUTH=$(printf "%s:%s" "jlxq0" "${{ secrets.FORGE_PUSH_TOKEN }}" | base64 -w0)
          echo "{\"auths\":{\"forge.oddie.app\":{\"auth\":\"$F_AUTH\"}}}" > ~/.docker/config.json

      - name: Compute version and tags
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION_RE='^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z][0-9A-Za-z.-]*)?$'
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            if [[ ! "$VERSION" =~ $VERSION_RE ]]; then
              echo "::error::Invalid release tag: $VERSION"; exit 1
            fi
          else
            BASE="$(jq -r '."."' .release-please-manifest.json)"
            if [[ ! "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid manifest version: $BASE"; exit 1
            fi
            VERSION="${BASE}-beta.$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          set -euo pipefail
          # buildkitd runs on the runner *host*, so it is reachable at our own
          # bridge gateway. Never hardcode it: the address changes on reboot and
          # DHCP, and a stale literal hangs until TCP timeout rather than
          # failing fast — which reads as a build failure with no build output.
          GW="$(ip -4 route 2>/dev/null | awk '/^default/{print $3; exit}')"
          if [ -z "$GW" ]; then
            h=$(awk '$2=="00000000"{print $3; exit}' /proc/net/route)
            GW=$(printf '%d.%d.%d.%d' "0x${h:6:2}" "0x${h:4:2}" "0x${h:2:2}" "0x${h:0:2}")
          fi
          export BUILDKIT_HOST="tcp://${GW}:1234"
          echo "buildkitd at ${BUILDKIT_HOST}"
          CACHE_REF="forge.oddie.app/${IMAGE_NAME}:cache"
          V="${{ steps.meta.outputs.version }}"
          S="${{ steps.meta.outputs.short_sha }}"
          buildctl build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --opt build-arg:APP_VERSION=${V} \
            --import-cache "type=registry,ref=${CACHE_REF}" \
            --export-cache "type=registry,ref=${CACHE_REF},mode=max" \
            --output "type=image,\"name=forge.oddie.app/${IMAGE_NAME}:v${V},forge.oddie.app/${IMAGE_NAME}:sha-${S}\",push=true"
